name: Prepare iOS project

on:
  push:
    branches:
      - ios-app
    paths-ignore:
      - 'ios/**'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build static web app
        run: npm run build

      - name: Generate Capacitor iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Apply Sun Shield iOS settings
        run: |
          python - <<'PY'
          import plistlib
          import struct
          import zlib
          from pathlib import Path

          plist_path = Path('ios/App/App/Info.plist')
          with plist_path.open('rb') as f:
              data = plistlib.load(f)

          data['CFBundleDisplayName'] = 'Sun Shield'
          data['NSLocationWhenInUseUsageDescription'] = (
              'Sun Shield uses your location only when you choose Current Location '
              'to calculate your route and sun exposure.'
          )
          data['ITSAppUsesNonExemptEncryption'] = False

          with plist_path.open('wb') as f:
              plistlib.dump(data, f, sort_keys=False)

          # Make an opaque 1024x1024 Sun Shield icon without external image tools.
          width = height = 1024
          cx = cy = 512
          raw = bytearray()
          for y in range(height):
              raw.append(0)
              for x in range(width):
                  dx, dy = x - cx, y - cy
                  d2 = dx * dx + dy * dy
                  r, g, b = 7, 17, 28
                  if d2 < 250 * 250:
                      r, g, b = 255, 183, 3
                  shield = (abs(dx) < 125 and -120 < dy < 105 and
                            (dy < -35 or abs(dx) < 125 - int((dy + 35) * 0.72)))
                  if shield:
                      r, g, b = 248, 251, 255
                  raw.extend((r, g, b))

          def chunk(kind, payload):
              return (struct.pack('>I', len(payload)) + kind + payload +
                      struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff))

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
          png += chunk(b'IEND', b'')

          icon_path = Path('ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png')
          icon_path.write_bytes(png)
          PY

      - name: Commit generated Xcode project
        run: |
          git config user.name "SunShield iOS Builder"
          git config user.email "actions@users.noreply.github.com"
          git add ios package-lock.json
          # Capacitor ignores these generated files by default, but they are
          # required so the checked-out Xcode project contains the real app.
          git add -f ios/App/App/public
          git add -f ios/App/App/capacitor.config.json
          git add -f ios/App/App/config.xml
          if git diff --cached --quiet; then
            echo "iOS project is already up to date."
          else
            git commit -m "Generate iOS App Store project"
            git push origin HEAD:ios-app
          fi
